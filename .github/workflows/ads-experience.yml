name: Workspace release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e:connected -- tests/e2e-connected/ads.spec.ts tests/e2e-connected/manuscripts.spec.ts tests/e2e-connected/workspace.spec.ts tests/e2e-connected/experience.spec.ts tests/e2e-connected/ux-search-decisions.spec.ts tests/e2e-connected/characters.spec.ts tests/e2e-connected/history-search.spec.ts tests/e2e-connected/daily-workspace.spec.ts tests/e2e-connected/ux-drafts.spec.ts tests/e2e-connected/workspace-export.spec.ts tests/e2e-connected/creative-home.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-evidence
          path: test-results-connected/
          retention-days: 7
